name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted publishing (recommended): leave NODE_AUTH_TOKEN unset and
      # add this repo as a trusted publisher on npmjs.com.
      # Token alternative: set the secret NPM_TOKEN and uncomment the env below.
      - name: Publish to npm
        run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Changelog notes
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME}" > /tmp/release-notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
