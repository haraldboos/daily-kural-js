name: Feature request
description: An idea for daily-kural-js.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, similar tools, or a sketch of the API.
